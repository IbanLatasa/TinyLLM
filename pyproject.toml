[project]
name = "tinyllm"
version = "0.1.0"
description = "A small language model built from scratch"
readme = "README.md"
authors = [
    { name = "IbanLatasa", email = "ibanlatasa69@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "tokenizer>=3.6.4",
    "tokenizers>=0.23.1",
    "torch>=2.13.0",
]

[project.scripts]
tinyllm = "tinyllm:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
